<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>きょう</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="data:application/json,%7B%22name%22%3A%22%E3%81%8D%E3%82%87%E3%81%86%22%2C%22short_name%22%3A%22%E3%81%8D%E3%82%87%E3%81%86%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%230b0e14%22%7D">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{background:#0a0d14;
 font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
 font-size:16px;line-height:1.5;transition:background .42s}
.pane{position:fixed;inset:0;display:flex;flex-direction:column;
 transition:transform .42s cubic-bezier(.32,.72,0,1),filter .42s}

#pk{--bg:#0a0d14;--bg2:rgba(255,255,255,.06);--line:rgba(255,255,255,.10);--line2:rgba(255,255,255,.19);
 --tx:#f2f5f8;--tx2:rgba(242,245,248,.62);--tx3:rgba(242,245,248,.42);
 --now:#ffc98f;--task:#8fd8ff;--dim:rgba(242,245,248,.24);
 --glass:rgba(255,255,255,.055);--gline:rgba(255,255,255,.13);
 background:var(--bg);color:var(--tx);z-index:10}
#pk.back{filter:brightness(.4)}
/* 背景のにじみ。カードはこれをぼかして透かす */
#pk::before,#pk::after,#pt::before,#pt::after{content:"";position:absolute;border-radius:50%;
 filter:blur(60px);z-index:0;pointer-events:none}
#pk::before{width:300px;height:300px;left:-70px;top:-40px;background:rgba(120,160,255,.5)}
#pk::after{width:300px;height:300px;right:-90px;bottom:-40px;background:rgba(90,230,200,.34)}
#pk header,#pk main{position:relative;z-index:1}
.glass{background:var(--glass);border:1px solid var(--gline);
 backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
 box-shadow:0 12px 38px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.14)}

#pt{--ink:#f2f5f8;--ink2:rgba(242,245,248,.62);--ink3:rgba(242,245,248,.42);
 --paper:#0c0a14;--paper2:rgba(255,255,255,.05);
 --pline:rgba(255,255,255,.16);--mark:#8fd8ff;--marks:rgba(143,216,255,.16);
 background:var(--paper);color:var(--ink);z-index:20;transform:translateY(100%)}
#pt::before{width:320px;height:320px;right:-90px;top:-60px;background:rgba(180,150,255,.5)}
#pt::after{width:300px;height:300px;left:-90px;bottom:-70px;background:rgba(143,216,255,.4)}
#pt .ht{z-index:6}
#pt.on{transform:translateY(0)}

.handle{flex:none;display:flex;align-items:center;justify-content:center;
 font-size:12px;letter-spacing:.16em;touch-action:none;user-select:none;
 -webkit-user-select:none;position:relative}
.hk{padding:16px 0 calc(env(safe-area-inset-bottom) + 16px);color:var(--tx3);
 border-top:1px solid var(--line);background:linear-gradient(180deg,transparent,rgba(143,216,255,.06))}
.hk .bar{position:absolute;top:7px;left:50%;transform:translateX(-50%);
 width:38px;height:3px;border-radius:2px;background:var(--line2)}
.ht{padding:calc(env(safe-area-inset-top) + 16px) 0 14px;color:var(--ink3);
 border-bottom:1px solid var(--pline)}
.ht .bar{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);
 width:38px;height:3px;border-radius:2px;background:var(--pline)}

/* ===== きょう ===== */
#pk header{flex:none;padding:calc(env(safe-area-inset-top) + 18px) 20px 12px;
 display:flex;align-items:flex-end;gap:12px;border-bottom:1px solid var(--line)}
.clock{font-size:42px;font-weight:200;letter-spacing:-.02em;line-height:1;font-variant-numeric:tabular-nums}
.date{flex:1;font-size:12px;color:var(--tx2);padding-bottom:4px}
#pk header button{background:none;border:1px solid var(--line2);border-radius:14px;
 padding:6px 11px;font:inherit;font-size:11px;color:var(--tx2)}
#pk header button.warn{border-color:var(--now);color:var(--now)}
#pk main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 20px 20px}
.mas{border:1px solid var(--gline);border-radius:22px;padding:18px 19px;margin-bottom:14px;
 background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
 box-shadow:0 12px 38px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.14)}
.mas .lb{font-size:11px;letter-spacing:.26em;color:var(--task);margin-bottom:10px}
.mas .tx{font-size:19px;line-height:1.4;word-break:break-word}
.mas .tx.empty{color:var(--tx3);font-size:16px}
.mas .why{font-size:11px;color:var(--tx3);margin-top:5px}
.mas.wait{box-shadow:none;background:rgba(255,255,255,.03)}
.mas .tx.thinking{color:var(--task)}
.mas .row:empty{display:none}
@keyframes blink{0%,100%{opacity:.35}50%{opacity:1}}
.mas .tx.thinking .dot{animation:blink 1.3s infinite}
.mas .row{display:flex;gap:8px;margin-top:12px}
.mas .row button{flex:1;background:none;border:1px solid var(--line2);border-radius:16px;
 padding:14px;font:inherit;font-size:13px;color:var(--tx2)}
.mas .row button.pri{border:0;border-radius:16px;padding:15px;font-size:15px;font-weight:700;
 background:linear-gradient(135deg,#8fd8ff,#b496ff);color:#0a0d14;
 box-shadow:0 8px 24px rgba(143,216,255,.26)}
.memo{border:1px solid var(--gline);border-radius:22px;padding:16px 18px;margin-bottom:22px;
 background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
 box-shadow:0 12px 38px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.14)}
.memo .lb{font-size:10px;letter-spacing:.24em;color:var(--tx3);margin-bottom:7px}
.memo textarea{width:100%;background:rgba(0,0,0,.22);border:1px solid var(--line2);border-radius:14px;
 color:var(--tx);font:inherit;font-size:15px;line-height:1.5;padding:9px 10px;
 min-height:64px;max-height:200px;resize:none;display:block}
.memo textarea::placeholder{color:var(--tx3)}
.memo textarea:focus{outline:none;border-color:var(--task)}
.memo button{width:100%;margin-top:10px;border:0;border-radius:16px;padding:14px;font:inherit;
 font-size:14px;font-weight:700;background:linear-gradient(135deg,#8fd8ff,#b496ff);color:#0a0d14;
 box-shadow:0 8px 24px rgba(143,216,255,.24)}
.memo button:disabled{background:rgba(255,255,255,.07);color:var(--tx3);box-shadow:none}
.memo .note{font-size:11px;color:var(--tx3);margin-top:7px;min-height:15px}
.day{margin-bottom:14px;padding:16px 18px;border-radius:22px;
 background:var(--glass);border:1px solid var(--gline);
 backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
 box-shadow:0 12px 38px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.14)}
.dh{display:flex;align-items:baseline;gap:10px;margin-bottom:10px;padding-bottom:7px;
 border-bottom:1px solid var(--line)}
.dh b{font-size:13px;font-weight:600;letter-spacing:.1em}
.dh span{font-size:11px;color:var(--tx3);flex:1}
.dh i{font-style:normal;font-size:11px;color:var(--tx3)}
.ev{display:flex;gap:14px;padding:11px 0;border-bottom:1px solid rgba(35,43,58,.6);position:relative}
.ev:last-child{border-bottom:0}
.ev .t{font-size:15px;color:var(--tx2);font-variant-numeric:tabular-nums;width:52px;flex:none;padding-top:1px}
.ev .n{flex:1;font-size:17px;word-break:break-word}
.ev .x{color:var(--tx3);font-size:18px;padding:0 2px;flex:none}
.ev.past .t,.ev.past .n{color:var(--dim)}
.ev.next{margin:0 -12px;padding:11px 12px;border-radius:12px;
 background:linear-gradient(90deg,rgba(232,180,92,.13),transparent)}
.ev.next .t{color:var(--now);font-weight:600}
.ev.next .n{color:#fff}
.ev.next::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:2px;background:var(--now)}
.ev .in{font-size:11px;color:var(--now);margin-top:2px}
.ev .cal{font-size:10px;color:var(--tx3);margin-top:2px;letter-spacing:.06em}
.none{color:var(--tx3);font-size:14px;padding:8px 0}
.add{width:100%;margin-top:8px;background:none;border:1px dashed var(--line2);border-radius:14px;
 padding:11px;font:inherit;font-size:13px;color:var(--tx3)}

.sheet{position:fixed;inset:0;z-index:80;background:rgba(4,6,12,.55);display:none;align-items:flex-end;
 backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.sheet.on{display:flex}
.card{width:100%;background:rgba(28,32,46,.72);border-top:1px solid rgba(255,255,255,.16);
 border-radius:26px 26px 0 0;backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);
 padding:22px 20px calc(env(safe-area-inset-bottom) + 20px);color:#f2f5f8;
 box-shadow:0 -14px 44px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.18)}
.card h3{margin:0 0 14px;font-size:14px;font-weight:600;letter-spacing:.08em;color:rgba(242,245,248,.62)}
.card input,.card textarea{width:100%;background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.19);
 border-radius:14px;padding:13px;font:inherit;font-size:17px;color:#f2f5f8;outline:none;margin-bottom:10px}
.card textarea{min-height:120px;font-size:14px;line-height:1.6;resize:none}
.card input:focus,.card textarea:focus{border-color:#8fd8ff}
.card .btns{display:flex;gap:10px;margin-top:6px}
.card .btns button{flex:1;padding:15px;border:0;border-radius:16px;font:inherit;font-size:15px;font-weight:700}
.card .btns .c{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16);
 color:rgba(242,245,248,.7);flex:0 0 90px}
.card .btns .o{background:linear-gradient(135deg,#8fd8ff,#b496ff);color:#0a0d14;
 box-shadow:0 8px 24px rgba(143,216,255,.28)}
.card .hint{font-size:11px;color:rgba(242,245,248,.42);margin:-4px 0 12px;line-height:1.6}

/* ===== とい ===== */
#tfog{position:absolute;inset:0;pointer-events:none;z-index:5;opacity:0;transition:opacity 1.4s;
 background:radial-gradient(120% 80% at 20% 0%,rgba(6,4,14,.72),transparent 62%),
            radial-gradient(140% 90% at 90% 100%,rgba(6,4,14,.66),transparent 66%)}
#pt .top{flex:none;padding:8px 20px 4px;display:flex;align-items:center;gap:9px;position:relative;z-index:6}
#pt .brand{font-size:11px;letter-spacing:.2em;color:var(--ink3);flex:1}
#pt .top button{background:rgba(255,255,255,.06);border:1px solid var(--pline);border-radius:14px;
 padding:7px 12px;font:inherit;font-size:11px;color:var(--ink2)}
#tbody{flex:1;overflow-y:auto;padding:10px 22px 8px;display:flex;flex-direction:column;
 justify-content:center;position:relative;z-index:6}
.cat{font-size:11px;letter-spacing:.18em;color:var(--ink3);margin-bottom:14px}
.qq{font-size:28px;font-weight:700;line-height:1.35;margin:0 0 20px;letter-spacing:-.01em}
#tbody textarea{width:100%;border:0;border-bottom:2px solid var(--pline);background:none;
 font:inherit;font-size:20px;color:var(--ink);padding:8px 0;outline:none;resize:none;
 min-height:84px;line-height:1.6}
#tbody textarea:focus{border-color:var(--mark)}
.yn{display:flex;gap:10px;margin-bottom:16px}
.yn button{flex:1;padding:15px;border:1px solid var(--pline);border-radius:16px;background:rgba(255,255,255,.05);
 font:inherit;font-size:17px;color:var(--ink)}
.yn button.on{background:var(--marks);border-color:var(--mark);color:var(--mark);font-weight:700}
.padwrap{flex:none;position:relative;height:150px;background:var(--paper2);
 border-top:1px solid var(--pline);display:flex;align-items:center;justify-content:center;z-index:6;
 backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px)}
.hintx{position:absolute;top:8px;left:0;right:0;text-align:center;font-size:11px;color:var(--ink3)}
.skipbtn{position:absolute;left:14px;bottom:16px;background:rgba(255,255,255,.06);border:1px solid var(--pline);
 border-radius:20px;padding:12px 18px;font:inherit;font-size:13px;color:var(--ink3)}
.ring{position:relative;width:128px;height:128px;display:grid;place-items:center;touch-action:none}
.slot{position:absolute;font-size:26px;opacity:.34;transition:all .18s;pointer-events:none;filter:grayscale(1)}
.slot.up{top:-2px}.slot.dn{bottom:-2px}.slot.lf{left:-4px}.slot.rt{right:-4px}
.slot.hot{opacity:1;filter:none;transform:scale(1.5)}
.pad{width:76px;height:76px;border-radius:50%;border:1px solid rgba(255,255,255,.4);
 background:linear-gradient(135deg,#8fd8ff,#b496ff);
 color:#0a0d14;display:grid;place-items:center;font-size:13px;font-weight:700;line-height:1.25;
 text-align:center;transition:transform .12s,background .15s,border-color .15s;
 box-shadow:0 10px 30px rgba(143,216,255,.32),inset 0 2px 0 rgba(255,255,255,.45)}
.pad.empty{background:rgba(255,255,255,.06);color:var(--ink3);border-color:var(--pline);box-shadow:none}
.burst{position:absolute;width:76px;height:76px;border-radius:50%;pointer-events:none;opacity:0}
.cancel{position:absolute;font-size:32px;color:#b4483c;opacity:0;pointer-events:none;
 transition:opacity .12s,transform .12s;transform:scale(.7);font-weight:700;z-index:3}
.cancel.on{opacity:1;transform:scale(1)}
.lvdots{position:absolute;bottom:-20px;display:flex;gap:5px}
.lvdots i{width:6px;height:6px;border-radius:50%;background:var(--pline)}
.lvdots i.on{background:currentColor;transform:scale(1.3)}
.flash{position:fixed;inset:0;z-index:90;pointer-events:none;opacity:0;transition:opacity .35s}
.tdone{padding:36px 24px;text-align:center;color:var(--ink2);font-size:15px}
.tdone b{display:block;font-size:22px;color:var(--ink);margin-bottom:10px}
.tdone .mas1{margin:22px 0 0;padding:14px;border:1px dashed var(--pline);border-radius:10px;
 font-size:14px;color:var(--ink2);text-align:left}
.tdone .mas1 span{display:block;font-size:10px;letter-spacing:.2em;color:var(--ink3);margin-bottom:5px}
.tdone .again{margin-top:20px;background:none;border:1px solid var(--pline);border-radius:20px;
 padding:11px 22px;font:inherit;font-size:14px;color:var(--ink2)}
#tlog{display:none;flex:1;overflow-y:auto;padding:8px 20px 30px;position:relative;z-index:6}
#tlog .e{border-bottom:1px solid var(--pline);padding:12px 0}
#tlog .e .tt{font-size:11px;color:var(--ink3);font-variant-numeric:tabular-nums}
#tlog .e .q2{font-size:14px;color:var(--ink2);margin-top:3px}
#tlog .e .a2{font-size:16px;margin-top:2px}
#tio{width:100%;font-size:12px;min-height:220px;border:1px solid var(--pline);border-radius:8px;
 padding:8px;font-family:inherit}
</style>
</head>
<body>
<div class="flash" id="flash"></div>

<section class="pane" id="pk">
  <header>
    <div class="clock" id="clock">--:--</div>
    <div class="date" id="date"></div>
    <button id="bsend">未設定</button>
    <button id="bpaste">貼り付け</button>
  </header>
  <main>
    <div class="mas" id="mas">
      <div class="lb">きょうの1マス</div>
      <div class="tx empty" id="mtx">読み込み中</div>
      <div class="why" id="mwhy"></div>
      <div class="row" id="mrow"></div>
    </div>
    <div class="day" id="d0"></div>
    <div class="day" id="d1"></div>
    <div class="memo">
      <div class="lb">メモ</div>
      <textarea id="memoin" placeholder="なんでも。思いついたこと、あとで見返したいこと"></textarea>
      <button id="memobtn" disabled>ジャーナルに送る</button>
      <div class="note" id="memonote"></div>
    </div>
  </main>
  <div class="handle hk" id="toToi"><span class="bar"></span>とい　↓</div>
</section>

<section class="pane" id="pt">
  <div id="tfog"></div>
  <div class="handle ht" id="toKyou">↑　きょう<span class="bar"></span></div>
  <div class="top">
    <span class="brand" id="tbrand">とい</span>
    <button id="tblog">ログ</button>
    <button id="tbexp">書き出す</button>
  </div>
  <div id="tbody"></div>
  <div id="tlog"></div>
  <div class="padwrap" id="tpad">
    <button class="skipbtn" id="tskip">パス</button>
    <div class="hintx" id="thint">タップ＝無表情で送信</div>
    <div class="ring" id="tring">
      <span class="slot up">😊</span><span class="slot rt">😢</span>
      <span class="slot dn">😠</span><span class="slot lf">🤮</span>
      <div class="burst" id="tburst"></div>
      <div class="cancel" id="tcancel">✕</div>
      <div class="pad empty" id="tpadbtn">今は<br>やらない</div>
      <div class="lvdots" id="tlvdots"><i></i><i></i><i></i></div>
    </div>
  </div>
</section>

<div class="sheet" id="sheet"><div class="card" id="card"></div></div>

<script>
const $=i=>document.getElementById(i);
const BOUND=6;
const pad2=n=>String(n).padStart(2,"0");
const key=d=>d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate());
function logical(d){const x=new Date(d);if(x.getHours()<BOUND)x.setDate(x.getDate()-1);return x;}
function mins(t){if(t==="--:--")return -1;const[h,m]=t.split(":").map(Number);return (h<BOUND?h+24:h)*60+m;}
const esc=s=>String(s).replace(/[<>&]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;"}[c]));

/* ===== 面の切り替え ===== */
const PK=$("pk"),PT=$("pt");
let face="kyou";
function show(f,quiet){
 face=f;
 PT.classList.toggle("on",f==="toi");
 PK.classList.toggle("back",f==="toi");
 document.body.style.background=f==="toi"?"#0c0a14":"#0a0d14";
 if(f==="toi"&&!quiet)TOI.wake();
 if(f==="kyou")KYOU.render();
}
function bindHandle(el,want,target){
 let sy=0,moved=false,down=false;
 el.addEventListener("pointerdown",e=>{down=true;moved=false;sy=e.clientY;
  try{el.setPointerCapture(e.pointerId);}catch(_){}});
 el.addEventListener("pointermove",e=>{if(!down)return;
  const dy=e.clientY-sy;
  if(Math.abs(dy)>8)moved=true;
  if(want*dy>44){down=false;show(target);}});
 el.addEventListener("pointerup",()=>{if(down&&!moved)show(target);down=false;});
 el.addEventListener("pointercancel",()=>{down=false;});
}
bindHandle($("toToi"),1,"toi");
bindHandle($("toKyou"),-1,"kyou");

function sheet(html,onOk){
 $("card").innerHTML=html+
  '<div class="btns"><button class="c" id="sc">やめる</button><button class="o" id="so">決定</button></div>';
 $("sheet").classList.add("on");
 $("sc").onclick=()=>$("sheet").classList.remove("on");
 $("so").onclick=()=>{if(onOk()!==false){$("sheet").classList.remove("on");KYOU.save();KYOU.render();}};
}

/* ================= ジャーナルに送る ================= */
/* 答えたものを端末に貯めて、Workerにまとめて投げる。
   電波がなくても消えない。失敗したぶんは次に成功したときに一緒に行く。 */
const SEND=(()=>{
const K="ingest:v1";
const CAP=400;
let ST={url:"",token:"",q:[]};
let busy=false,last="",timer=null;
function load(){try{const r=localStorage.getItem(K);if(r)ST=Object.assign(ST,JSON.parse(r));}catch(e){}
 if(!Array.isArray(ST.q))ST.q=[];}
function save(){try{localStorage.setItem(K,JSON.stringify(ST));}catch(e){}}
const on=()=>!!(ST.url&&ST.token);
const flat=s=>String(s==null?"":s).replace(/\s+/g," ").trim();
function paint(){
 const b=$("bsend");if(!b)return;
 b.textContent=!on()?"未設定":(busy?"送信中":(ST.q.length?"未送信 "+ST.q.length:"送信済"));
 b.classList.toggle("warn",on()&&!busy&&ST.q.length>0);
}
/* 貯められたら true。送り先が未設定なら false（呼んだ側で知らせる） */
function push(it){
 if(!on())return false;
 it.at=new Date().toISOString();
 ST.q.push(it);
 if(ST.q.length>CAP)ST.q=ST.q.slice(-CAP);
 save();paint();later();
 return true;
}
/* 少し待ってから送る。続けて答えたぶんは1回にまとめる */
function later(){clearTimeout(timer);timer=setTimeout(()=>{timer=null;flush();},1200);}
/* 貯まったものを、ジャーナルの1件ぶんに束ねる。
   といの回答はその日ぶんで1件、1マスの完了は1件ずつ。 */
function pack(items){
 const out=[],grp={};
 items.forEach(it=>{
  /* メモは改行をそのまま残したいので text で渡す */
  if(it.k==="memo"){out.push({at:it.at,text:"【メモ】"+it.text});return;}
  if(it.k!=="toi"){
   const ln=["【1マス完了】"+it.text];
   if(it.memo)ln.push(it.memo);

/* ヘッダには半角しか入らない。日本語の合言葉は本文に入れて送る */
function auth(pay){
 const hd={"Content-Type":"application/json"};
 if(/^[\x20-\x7e]+$/.test(ST.token))hd["Authorization"]="Bearer "+ST.token;
 else pay.token=ST.token;
 return hd;
}
function flush(){
 clearTimeout(timer);timer=null;
 if(busy||!on()||!ST.q.length)return Promise.resolve(false);
 const n=ST.q.length,pay={entries:pack(ST.q.slice(0,n))};
 const hd=auth(pay);
 busy=true;paint();
 return fetch(ST.url+"/ingest",{method:"POST",keepalive:true,headers:hd,body:JSON.stringify(pay)})
  .then(r=>r.text().then(t=>{
   let j=null;try{j=JSON.parse(t);}catch(e){}
   if(r.ok&&j&&j.ok){ST.q.splice(0,n);last="";return true;}
   last=(j&&j.message)||(r.status===404?"アドレスが違います":"送れませんでした（"+r.status+"）");
   return false;}))
  .catch(()=>{last="繋がりません。電波かアドレスを見てください";return false;})
  .then(v=>{busy=false;save();paint();if(v&&ST.q.length)later();return v;});
}
/* 「次の1マスを選び直して」をWorkerに投げる。
   true なら頼めた。文字列ならその理由で頼めなかった。
   完了のメモがジャーナルに入ってからでないとClaudeが読めないので、先に送りきる。 */
function next(){
 return flush().then(()=>{
  if(!on())return "ジャーナルの設定がまだです";
  if(ST.q.length)return last||"完了のメモをまだ送れていません";
  const pay={},hd=auth(pay);
  return fetch(ST.url+"/next",{method:"POST",headers:hd,body:JSON.stringify(pay)})
   .then(r=>r.text().then(t=>{
    let j=null;try{j=JSON.parse(t);}catch(e){}
    if(r.ok&&j&&j.ok)return true;
    return (j&&j.message)||(r.status===404?"アドレスが違います":"頼めませんでした（"+r.status+"）");}))
   .catch(()=>"繋がりません。電波かアドレスを見てください");
 });
}

let queue=[],cur=null,draft="",yn=null;
let dragging=false,dir=null,lv=0,flicked=false,holdT=null,sx=0,sy=0;
const pd=$("tpadbtn"),ring=$("tring"),burst=$("tburst"),lvd=$("tlvdots");
const PASSHTML='<span style="color:#9aa1a9">パス</span>';
const nowS=()=>new Date().toLocaleString("ja-JP",{month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"});

function load(){try{const r=localStorage.getItem(K);if(r)ST=Object.assign(ST,JSON.parse(r));}catch(e){}
 if(!ST.dic||!Object.keys(ST.dic).length)ST.dic=JSON.parse(JSON.stringify(DIC0));
 const t=key(logical(new Date()));if(ST.day!==t){ST.day=t;ST.asked=[];}}
function save(){try{localStorage.setItem(K,JSON.stringify(ST));}catch(e){}}
function fogLv(){const r=ST.log.slice(-10);if(r.length<3)return 1;
 const p=r.filter(e=>e.a==="__pass__").length/r.length;return p>.5?0:(p>.2?1:2);}
function build(k){let t=k.t[Math.floor(Math.random()*k.t.length)];
 if(k.s){const a=(ST.dic[k.s]||[]).filter(w=>NG.indexOf(w)<0);if(!a.length)return null;
  t=t.replace("{"+k.s+"}",a[Math.floor(Math.random()*a.length)]);}
 return {q:t,c:k.c,yn:!!k.yn};}
function syncSlots(){
 try{
  ST.dic["予定"]=(KYOU.events()||[]).filter(w=>w&&w.length<=20);
  ST.dic["タスク"]=(KYOU.tasks()||[]).filter(w=>w&&w.length<=30);
 }catch(e){ST.dic["予定"]=[];ST.dic["タスク"]=[];}
}
function pick(n){
 syncSlots();
 const f=fogLv(),cats=MIX[f],pool=SK.filter(k=>k.d<=f&&cats.indexOf(k.c)>=0);
 const tei=pool.filter(k=>k.c==="定点");
 const out=[build(tei[Math.floor(Math.random()*tei.length)])];
 const used=new Set(ST.asked);let g=0;
 while(out.length<n&&g++<300){
  const b=build(pool[Math.floor(Math.random()*pool.length)]);
  if(!b||used.has(b.q)||out.some(o=>o.q===b.q))continue;
  out.push(b);used.add(b.q);
 }
 return out;
}
function learn(t){if(!t||t.length>40)return;
 t.split(/[、,。\s]+/).filter(w=>w.length>=2&&w.length<=12&&NG.indexOf(w)<0)
  .forEach(w=>{if(ST.dic["語"].indexOf(w)<0)ST.dic["語"].push(w);});
 if(ST.dic["語"].length>200)ST.dic["語"]=ST.dic["語"].slice(-200);}

function render(){
 $("tfog").style.opacity=[0.7,0.28,0][fogLv()];
 $("tbrand").textContent=queue.length?("とい　のこり "+queue.length):"とい";
 $("tlog").style.display="none";$("tbody").style.display="flex";
 if(!cur){
  $("tpad").style.display="none";
  const m=KYOU.mas();
  $("tbody").innerHTML='<div class="tdone"><b>おわり</b>今日のぶんは以上。'+
   (m?'<div class="mas1"><span>きょうの1マス</span>'+esc(m)+'</div>':"")+
   '<button class="again" id="tagain">もう少しやる</button></div>';
  $("tagain").onclick=()=>{queue=pick(3);next();};
  return;
 }
 $("tpad").style.display="flex";
 $("tbody").innerHTML='<div class="cat">'+cur.c+'</div><h1 class="qq">'+esc(cur.q)+'</h1>'+
  (cur.yn?'<div class="yn"><button data-v="はい">はい</button><button data-v="いいえ">いいえ</button></div>':"")+
  '<textarea id="tta" placeholder="'+(cur.yn?"（はいなら、なに?）":"")+'"></textarea>';
 if(cur.yn)$("tbody").querySelectorAll(".yn button").forEach(b=>{
  if(yn===b.dataset.v)b.classList.add("on");
  b.onclick=()=>{yn=(yn===b.dataset.v?null:b.dataset.v);render();};});
 const ta=$("tta");ta.value=draft;ta.oninput=()=>{draft=ta.value;syncPad();};
 syncPad();
}
const has=()=>!!(draft.trim()||yn);
function resetPad(){dir=null;lv=0;flicked=false;
 document.querySelectorAll("#pt .slot").forEach(s=>s.classList.remove("hot"));
 $("tcancel").classList.remove("on");
 pd.style.background="";pd.style.borderColor="";pd.style.transform="";pd.style.opacity="";
 burst.style.opacity=0;lvd.style.color="";
 [].forEach.call(lvd.children,d=>d.classList.remove("on"));}
function syncPad(){resetPad();
 pd.classList.toggle("empty",!has());
 pd.innerHTML=has()?"送る":"今は<br>やらない";
 $("thint").textContent=has()?"タップ＝無表情で送信／ずらすと感情がつく":"タップ＝「今はやらない」で送信";}
function paint(){
 document.querySelectorAll("#pt .slot").forEach(s=>s.classList.remove("hot"));
 if(dir){$("tcancel").classList.remove("on");
  const s=document.querySelector("#pt .slot."+dir);if(s)s.classList.add("hot");
  const E=EMO[dir];pd.style.opacity=1;
  pd.style.background=has()?E.c:"none";pd.style.borderColor=E.c;
  pd.innerHTML='<span style="font-size:29px">'+E.n[lv]+'</span>';
  lvd.style.color=E.c;[].forEach.call(lvd.children,(d,i)=>d.classList.toggle("on",i<=lv));
  pd.style.transform="scale("+(1+lv*.12)+")";
  burst.style.boxShadow="0 0 "+(18+lv*22)+"px "+(6+lv*8)+"px "+E.c+"55";burst.style.opacity=.9;
 }else if(flicked){$("tcancel").classList.add("on");
  pd.style.borderColor="var(--pline)";pd.style.background="";
  pd.style.transform="scale(.9)";pd.style.opacity=".18";burst.style.opacity=0;
 }else{$("tcancel").classList.remove("on");
  pd.style.background="";pd.style.borderColor="";pd.style.transform="scale(.94)";
  pd.style.opacity="";burst.style.opacity=0;}}
const dirOf=(dx,dy)=>{if(Math.sqrt(dx*dx+dy*dy)<26)return null;
 return Math.abs(dx)>Math.abs(dy)?(dx>0?"rt":"lf"):(dy>0?"dn":"up");};
function hold(){clearInterval(holdT);
 holdT=setInterval(()=>{if(dir&&lv<2){lv++;paint();if(navigator.vibrate)navigator.vibrate(12);}},520);}
ring.addEventListener("pointerdown",e=>{if(e.target.closest("#tskip"))return;
 dragging=true;dir=null;lv=0;flicked=false;sx=e.clientX;sy=e.clientY;
 try{ring.setPointerCapture(e.pointerId);}catch(_){}
 pd.style.transform="scale(.94)";hold();});
ring.addEventListener("pointermove",e=>{if(!dragging)return;
 const nd=dirOf(e.clientX-sx,e.clientY-sy);
 if(nd!==dir){if(nd)flicked=true;dir=nd;lv=0;paint();
  if(nd){hold();if(navigator.vibrate)navigator.vibrate(8);}else clearInterval(holdT);}});
ring.addEventListener("pointerup",()=>{if(!dragging)return;dragging=false;clearInterval(holdT);commit();});
ring.addEventListener("pointercancel",()=>{dragging=false;clearInterval(holdT);resetPad();syncPad();});
function flash(c){const f=$("flash");
 f.style.background="radial-gradient(circle at 50% 80%, "+c+"44, transparent 62%)";
 f.style.opacity=1;setTimeout(()=>{f.style.opacity=0;},60);}
function commit(){
 if(flicked&&!dir){resetPad();syncPad();return;}
 const e=dir?EMO[dir].n[lv]:null;
 if(dir)flash(EMO[dir].c);
 let a="__pass__";
 if(has()){a=(yn?yn+(draft.trim()?" / "+draft.trim():""):draft.trim());learn(draft.trim());}
 ST.log.push({t:nowS(),q:cur.q,c:cur.c,a:a,e:e});ST.asked.push(cur.q);
 if(a!=="__pass__")SEND.toi(cur.q,cur.c,a,e);
 save();resetPad();next();
}
$("tskip").onclick=()=>{if(!cur)return;
 ST.log.push({t:nowS(),q:cur.q,c:cur.c,a:"__pass__",e:null});ST.asked.push(cur.q);save();next();};
function next(){draft="";yn=null;cur=queue.shift()||null;render();if(!cur)SEND.flush();}
$("tblog").onclick=()=>{
 const L=$("tlog");
 if(L.style.display==="block"){render();return;}
 $("tbody").style.display="none";$("tpad").style.display="none";L.style.display="block";
 L.innerHTML=ST.log.slice().reverse().map(e=>
  '<div class="e"><div class="tt">'+e.t+'　'+e.c+'</div><div class="q2">'+esc(e.q)+'</div>'+
  '<div class="a2">'+(e.a==="__pass__"?PASSHTML:esc(e.a))+
  (e.e?" "+e.e:"")+'</div></div>').join("")||'<div class="tdone">まだ何もない</div>';};
$("tbexp").onclick=()=>{
 const txt="# とい ログ\n\n"+ST.log.map(e=>
  "- ["+e.t+"] ("+e.c+") "+e.q+" → "+(e.a==="__pass__"?"パス":e.a)+(e.e?" "+e.e:"")).join("\n");
 $("tbody").style.display="none";$("tpad").style.display="none";
 const L=$("tlog");L.style.display="block";L.innerHTML="";
 const ta=document.createElement("textarea");ta.id="tio";ta.value=txt;
 L.appendChild(ta);ta.select();
 try{navigator.clipboard.writeText(txt);}catch(e){}};
function wake(){
 const t=key(logical(new Date()));
 if(ST.day!==t){ST.day=t;ST.asked=[];save();}
 if(!cur&&!queue.length){queue=pick(3);next();}else render();
}
function boot(){load();queue=pick(3);next();}
return {boot:boot,wake:wake};
})();

SEND.boot();
MEMO.boot();
KYOU.boot();
TOI.boot();
const startToi=location.search.indexOf("q")>=0||location.hash==="#q";
show(startToi?"toi":"kyou",true);
/* 戻ってきたときに読み直す。
   iPhoneのホーム画面アプリは、裏に回るとタイマーが止まる。
   戻りの合図は端末やiOSのバージョンで違い、visibilitychange が来ないこともある。
   pageshow と focus も拾って、どれか1つでも来れば追いつくようにする。 */
function resume(){
 SEND.flush();
 if(document.hidden)return;
 KYOU.refetch();
 if(face==="kyou")KYOU.render();
}
document.addEventListener("visibilitychange",resume);
window.addEventListener("pageshow",resume);
window.addEventListener("focus",resume);
window.addEventListener("pagehide",()=>SEND.flush());
</script>
</body>
</html>
