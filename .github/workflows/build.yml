name: build

on:
  schedule:
    - cron: "0 6 * * *"    # 15:00 JST（起床後）
    - cron: "0 11 * * *"   # 20:00 JST（出勤前）
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: install deps
        run: npm install --no-audit --no-fund

      # 1. カレンダーを取得 → data/raw.json
      - name: fetch calendars
        env:
          ICS_URLS: ${{ secrets.ICS_URLS }}
        run: |
          if [ -z "$ICS_URLS" ]; then
            echo "::error::ICS_URLS が登録されていません。Settings → Secrets and variables → Actions で登録してください"
            exit 1
          fi
          node scripts/fetch.mjs

      # 2. Claude に「今日の1マス」を選ばせる（失敗しても続行）
      - name: install claude code
        id: cc_install
        continue-on-error: true
        run: npm install -g @anthropic-ai/claude-code

      - name: claude pass
        id: cc
        continue-on-error: true
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "トークン未設定のためスキップ"
            exit 1
          fi
          which claude || { echo "claude が PATH にありません"; exit 1; }
          claude --version
          claude -p "$(cat prompt.md)" --dangerously-skip-permissions

      # 3. Claude が動かなくても画面は出す
      - name: fallback
        if: steps.cc.outcome != 'success'
        run: node scripts/fallback.mjs

      - name: commit
        run: |
          git config user.name  "kyou-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A data/
          if git diff --staged --quiet; then
            echo "変更なし。commitしません"
          else
            git commit -m "update $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
